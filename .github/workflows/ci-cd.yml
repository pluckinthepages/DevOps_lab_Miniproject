# CampusFind CI/CD + DevSecOps pipeline
#
# [Job 1: test] -> [Job 2: security-scan] -> [Job 3: build-and-push] -> [Job 4: deploy] -> [Job 5: smoke-test]
#
# Jobs 3-5 only run on a push to main. Pull requests stop after the security gate.
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: 1. Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest --maxfail=1 --disable-warnings -v

  security-scan:
    name: 2. DevSecOps - Trivy image scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t campusfind:scan-test .

      - name: Trivy report (all severities, non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: campusfind:scan-test
          format: table
          output: trivy-report.txt
          exit-code: "0"
          ignore-unfixed: true

      - name: Publish scan summary
        if: always()
        run: |
          echo "## Trivy vulnerability scan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f trivy-report.txt ]; then head -c 60000 trivy-report.txt >> "$GITHUB_STEP_SUMMARY"; else echo "No report generated" >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore

      - name: Trivy gate (block on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: campusfind:scan-test
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  build-and-push:
    name: 3. Build & push to GHCR
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag image
        run: |
          IMAGE=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:${{ github.sha }} and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 4. Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.hook.outputs.deployed }}
    steps:
      - name: Trigger deploy hook
        id: hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deployment skipped: RENDER_DEPLOY_HOOK_URL is not set"
              echo ""
              echo "To enable automatic deployment:"
              echo "1. Create a Render Web Service from the GHCR image (or this repo's Dockerfile)."
              echo "2. Render dashboard -> Settings -> Deploy Hook -> copy the URL."
              echo "3. GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret:"
              echo "   - RENDER_DEPLOY_HOOK_URL = <deploy hook URL>"
              echo "   - APP_URL = https://<your-service>.onrender.com"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Deploy hook responded with HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Deploy hook failed with HTTP $status"
            exit 1
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Deployment triggered for commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: 5. Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      LIVE: ${{ needs.deploy.outputs.deployed == 'true' && secrets.APP_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Without a live deployment, run the freshly published image in the runner
      # so the smoke test still exercises the real release artifact.
      - name: Start released image locally (no live deployment configured)
        if: env.LIVE != 'true'
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name campusfind -p 5000:5000 -e SECRET_KEY=ci-smoke "$IMAGE:${{ github.sha }}"

      - name: Run smoke test
        run: python scripts/smoke_test.py --url "${{ env.LIVE == 'true' && env.APP_URL || 'http://localhost:5000' }}" --retries 12 --delay 10
