{% extends "base.html" %}
{% from "_macros.html" import item_form %}
{% block title %} · Report item{% endblock %}
{% block content %}
<section class="panel panel-narrow">
  <a href="{{ url_for('index') }}" class="back-link">&larr; Back to board</a>
  <h1>Report an item</h1>
  <p class="muted">Give as much detail as you can so the owner (or finder) can recognise it.</p>
  <form method="post" action="{{ url_for('new_item') }}" novalidate>
    {{ item_form(form, "Submit report") }}
  </form>
</section>
{% endblock %}
