{% extends "base.html" %}
{% block title %} · Log in{% endblock %}
{% block content %}
<section class="panel panel-auth">
  <h1>Welcome back</h1>
  <p class="muted">Log in to report and manage items.</p>
  <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
    <div class="field">
      <label class="label" for="email">Email or username</label>
      <input class="input" id="email" name="email" type="text" autocomplete="username" required value="{{ form.get('email', '') }}">
    </div>
    <div class="field">
      <label class="label" for="password">Password</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="muted center">No account? <a href="{{ url_for('register') }}">Sign up</a></p>
</section>
{% endblock %}
